<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mamma's Kitchen API Documentation</title>

  <!-- Link to Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Link to Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Prism.js for code highlighting -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>

  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
    
    .method-get { background-color: #61affe; }
    .method-post { background-color: #49cc90; }
    .method-put { background-color: #fca130; }
    .method-delete { background-color: #f93e3e; }
    
    .endpoint-card {
      transition: all 0.3s ease;
      border-left: 4px solid transparent;
    }
    
    .endpoint-card:hover {
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      transform: translateY(-2px);
    }
    
    .endpoint-card.get { border-left-color: #61affe; }
    .endpoint-card.post { border-left-color: #49cc90; }
    .endpoint-card.put { border-left-color: #fca130; }
    .endpoint-card.delete { border-left-color: #f93e3e; }
    
    .tab-active {
      border-bottom: 2px solid #1D4ED8;
      color: #1D4ED8;
    }
    
    .code-block {
      background-color: #2d2d2d;
      color: #f8f8f2;
      border-radius: 6px;
      padding: 16px;
      overflow-x: auto;
      font-family: 'Courier New', monospace;
    }
    
    .response-container {
      background-color: #2d2d2d;
      color: #f8f8f2;
      border-radius: 6px;
      padding: 16px;
      font-family: 'Courier New', monospace;
      max-height: 500px;
      overflow-y: auto;
    }
    
    .param-table th {
      background-color: #f3f4f6;
      font-weight: 600;
    }
    
    .param-table td, .param-table th {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
    }
    
    .param-table tr:hover {
      background-color: #f9fafb;
    }
    
    .sidebar-item {
      transition: all 0.2s ease;
    }
    
    .sidebar-item:hover {
      background-color: #f3f4f6;
      padding-left: 24px;
    }
    
    .sidebar-item.active {
      background-color: #e0e7ff;
      border-left: 3px solid #1D4ED8;
      padding-left: 24px;
      font-weight: 600;
    }
    
    .status-code-200 { color: #49cc90; }
    .status-code-201 { color: #49cc90; }
    .status-code-400 { color: #fca130; }
    .status-code-404 { color: #fca130; }
    .status-code-500 { color: #f93e3e; }
    
    .loading-spinner {
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top: 3px solid white;
      width: 16px;
      height: 16px;
      animation: spin 1s linear infinite;
      display: none;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 16px 24px;
      border-radius: 8px;
      color: white;
      font-weight: 500;
      z-index: 1000;
      transform: translateX(120%);
      transition: transform 0.3s ease;
    }
    
    .notification.show {
      transform: translateX(0);
    }
    
    .notification.success {
      background-color: #10b981;
    }
    
    .notification.error {
      background-color: #ef4444;
    }
    
    .notification.info {
      background-color: #3b82f6;
    }
  </style>
</head>
<body class="bg-gray-50">
  <!-- Notification -->
  <div id="notification" class="notification"></div>

  <!-- Header -->
  <header class="bg-gradient-to-r from-blue-600 to-blue-800 text-white shadow-lg">
    <div class="container mx-auto px-6 py-6">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-3xl font-bold flex items-center">
            <i class="fas fa-utensils mr-3"></i>
            Mamma's Kitchen API Documentation
          </h1>
          <p class="text-blue-100 mt-1">Explore and test all the available API endpoints</p>
        </div>
        <div class="flex items-center space-x-4">
          <button id="swagger-btn" class="bg-white text-blue-600 px-4 py-2 rounded-md font-medium hover:bg-blue-50 transition">
            <i class="fas fa-code mr-2"></i>View Swagger JSON
          </button>
          <a href="https://mk-be.vercel.app/api-docs" target="_blank" class="bg-blue-700 text-white px-4 py-2 rounded-md font-medium hover:bg-blue-800 transition">
            <i class="fas fa-external-link-alt mr-2"></i>Swagger UI
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <div class="container mx-auto px-6 py-8">
    <div class="flex flex-col lg:flex-row gap-8">
      <!-- Sidebar -->
      <aside class="lg:w-1/4">
        <div class="bg-white rounded-lg shadow-md p-4 sticky top-6">
          <h3 class="font-semibold text-lg mb-4 text-gray-800">API Categories</h3>
          <ul id="sidebar-menu" class="space-y-1">
            <!-- Sidebar items will be generated by JavaScript -->
          </ul>
        </div>
      </aside>

      <!-- Main Content Area -->
      <main class="lg:w-3/4">
        <!-- API Endpoints -->
        <div id="api-endpoints-container">
          <!-- API endpoints will be generated by JavaScript -->
        </div>
      </main>
    </div>
  </div>

  <!-- Response Modal -->
  <div id="response-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-4xl max-h-[80vh] overflow-hidden">
      <div class="bg-gray-800 text-white px-6 py-4 flex justify-between items-center">
        <h3 class="text-xl font-semibold">API Response</h3>
        <button id="close-modal" class="text-white hover:text-gray-300">
          <i class="fas fa-times text-xl"></i>
        </button>
      </div>
      <div class="p-6">
        <div class="mb-4 flex items-center justify-between">
          <div class="flex items-center space-x-4">
            <span id="response-status" class="px-3 py-1 rounded-full text-sm font-medium"></span>
            <span id="response-time" class="text-sm text-gray-600"></span>
          </div>
          <button id="copy-response" class="bg-blue-600 text-white px-4 py-2 rounded-md text-sm hover:bg-blue-700 transition">
            <i class="fas fa-copy mr-2"></i>Copy Response
          </button>
        </div>
        <div class="response-container">
          <pre id="response-text" class="text-sm"></pre>
        </div>
      </div>
    </div>
  </div>

  <!-- Swagger JSON Modal -->
  <div id="swagger-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-4xl max-h-[80vh] overflow-hidden">
      <div class="bg-gray-800 text-white px-6 py-4 flex justify-between items-center">
        <h3 class="text-xl font-semibold">Swagger JSON</h3>
        <button id="close-swagger-modal" class="text-white hover:text-gray-300">
          <i class="fas fa-times text-xl"></i>
        </button>
      </div>
      <div class="p-6">
        <div class="mb-4">
          <button id="copy-swagger" class="bg-blue-600 text-white px-4 py-2 rounded-md text-sm hover:bg-blue-700 transition">
            <i class="fas fa-copy mr-2"></i>Copy Swagger JSON
          </button>
        </div>
        <div class="code-block">
          <pre id="swagger-json"></pre>
        </div>
      </div>
    </div>
  </div>

  <script>
    // API Documentation Data
    const apiDocs = {
      "swagger": "2.0",
      "info": {
        "title": "Mamma's Kitchen API",
        "description": "API documentation for Mamma's Kitchen",
        "version": "1.0.0",
        "contact": {
          "name": "API Support",
          "email": "support@mammaskitchen.com"
        }
      },
      "host": "mk-be.vercel.app",
      "basePath": "/",
      "schemes": ["https"],
      "consumes": ["application/json"],
      "produces": ["application/json"],
      "paths": {
        // Users Endpoints
        "/api/users": {
          "get": {
            "tags": ["Users"],
            "summary": "Fetch all users",
            "description": "Retrieve a list of all users in the system",
            "responses": {
              "200": { "description": "OK" },
              "500": { "description": "Internal Server Error" }
            }
          },
          "post": {
            "tags": ["Users"],
            "summary": "Create a new user",

              "name": "body",
              "in": "body",
              "required": true,
              "schema": {
                "type": "object",
                "properties": {
                  "username": { "type": "string", "example": "john_doe" },
                  "email": { "type": "string", "example": "john@example.com" },
                  "password": { "type": "string", "example": "securepassword" },
                  "role": { "type": "string", "example": "customer" }
                }
              }
            }],
            "responses": {
              "201": { "description": "Created" },
              "400": { "description": "Bad Request" },
              "500": { "description": "Internal Server Error" }
            }
          }
        },
        "/api/users/{user_id}": {
          "get": {
            "tags": ["Users"],
            "summary": "Fetch a specific user by user_id",
            "description": "Retrieve details of a specific user",
            "parameters": [
              { "name": "user_id", "in": "path", "required": true, "type": "string", "description": "ID of the user" }
            ],
            "responses": {
              "200": { "description": "OK" },
              "404": { "description": "Not Found" },
              "500": { "description": "Internal Server Error" }
            }
          },
          "put": {
            "tags": ["Users"],
            "summary": "Update a user by user_id",
            "description": "Update details of a specific user",
            "parameters": [
              { "name": "user_id", "in": "path", "required": true, "type": "string", "description": "ID of the user" },
              { "name": "body", "in": "body", "required": true, "schema": { "type": "object", "properties": { "username": { "type": "string", "example": "john_doe_updated" }, "email": { "type": "string", "example": "john_updated@example.com" }, "password": { "type": "string", "example": "newpassword" }, "role": { "type": "string", "example": "admin" } } } }
            ],
            "responses": {
              "200": { "description": "OK" },
              "400": { "description": "Bad Request" },
              "404": { "description": "Not Found" },
              "500": { "description": "Internal Server Error" }
            }
          },
          "delete": {
            "tags": ["Users"],
            "summary": "Delete a user by user_id",
            "description": "Remove a user from the system",
            "parameters": [
              { "name": "user_id", "in": "path", "required": true, "type": "string", "description": "ID of the user" }
            ],
            "responses": {
              "200": { "description": "OK" },
              "404": { "description": "Not Found" },
              "500": { "description": "Internal Server Error" }
            }
          }
        },
        // Login Endpoints
        "/api/login": {
          "post": {
            "tags": ["Login"],
            "summary": "Record a login attempt",
            "description": "Record a login attempt for a user",
            "parameters": [{
              "name": "body",
              "in": "body",
              "required": true,
              "schema": {
                "type": "object",
                "properties": {
                  "user_id": { "type": "string", "example": "12345" },
                  "ip_address": { "type": "string", "example": "192.168.1.1" },
                  "user_agent": { "type": "string", "example": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" },
                  "login_status": { "type": "string", "example": "success" }
                }
              }
            }],
            "responses": {
              "201": { "description": "Created" },
              "400": { "description": "Bad Request" },
              "500": { "description": "Internal Server Error" }
            }
          }
        },
        "/api/login/{user_id}": {
          "get": {
            "tags": ["Login"],
            "summary": "Fetch login information for a specific user",
            "description": "Retrieve login history for a specific user",
            "parameters": [
              { "name": "user_id", "in": "path", "required": true, "type": "string", "description": "ID of the user" }
            ],
            "responses": {
              "200": { "description": "OK" },
              "404": { "description": "Not Found" },
              "500": { "description": "Internal Server Error" }
            }
          }
        },
        "/api/login/{login_id}": {
          "put": {
            "tags": ["Login"],
            "summary": "Update a login attempt by login_id",
            "description": "Update details of a specific login attempt",
            "parameters": [
              { "name": "login_id", "in": "path", "required": true, "type": "string", "description": "ID of the login attempt" },
              { "name": "body", "in": "body", "required": true, "schema": { "type": "object", "properties": { "user_id": { "type": "string", "example": "12345" }, "ip_address": { "type": "string", "example": "192.168.1.1" }, "user_agent": { "type": "string", "example": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" }, "login_status": { "type": "string", "example": "success" } } } }
            ],
            "responses": {
              "200": { "description": "OK" },
              "400": { "description": "Bad Request" },
              "404": { "description": "Not Found" },
              "500": { "description": "Internal Server Error" }
            }
          },
          "delete": {
            "tags": ["Login"],
            "summary": "Delete a login attempt by login_id",
            "description": "Remove a login attempt from the system",
            "parameters": [
              { "name": "login_id", "in": "path", "required": true, "type": "string", "description": "ID of the login attempt" }
            ],
            "responses": {
              "200": { "description": "OK" },
              "404": { "description": "Not Found" },
              "500": { "description": "Internal Server Error" }
            }
          }
        },
        // Audit Log Endpoints
        "/api/auditlog": {
          "post": {
            "tags": ["Audit Log"],
            "summary": "Record an audit log",
            "description": "Add a new audit log entry",
            "parameters": [{
              "name": "body",
              "in": "body",
              "required": true,
              "schema": {
                "type": "object",
                "properties": {
                  "user_id": { "type": "string", "example": "12345" },
                  "action": { "type": "string", "example": "update_order" },
                  "details": { "type": "string", "example": "Updated order status to delivered" },
                  "timestamp": { "type": "string", "example": "2023-06-15T14:30:00Z" }

            "responses": {
              "201": { "description": "Created" },
              "400": { "description": "Bad Request" },
              "500": { "description": "Internal Server Error" }
            }
          }
        },
        "/api/auditlog/{user_id}": {
          "get": {
            "tags": ["Audit Log"],
            "summary": "Fetch audit logs for a specific user",
            "description": "Retrieve audit log entries for a specific user",
            "parameters": [
              { "name": "user_id", "in": "path", "required": true, "type": "string", "description": "ID of the user" }
            ],
            "responses": {
              "200": { "description": "OK" },
              "404": { "description": "Not Found" },
              "500": { "description": "Internal Server Error" }
            }
          }
        },
        "/api/auditlog/{audit_id}": {
          "put": {
            "tags": ["Audit Log"],
            "summary": "Update an audit log by audit_id",
            "description": "Update details of a specific audit log entry",
            "parameters": [
              { "name": "audit_id", "in": "path", "required": true, "type": "string", "description": "ID of the audit log entry" },
              { "name": "body", "in": "body", "required": true, "schema": { "type": "object", "properties": { "user_id": { "type": "string", "example": "12345" }, "action": { "type": "string", "example": "update_order" }, "details": { "type": "string", "example": "Updated order status to delivered" }, "timestamp": { "type": "string", "example": "2023-06-15T14:30:00Z" } } } }
            ],
            "responses": {
              "200": { "description": "OK" },
              "400": { "description": "Bad Request" },
              "404": { "description": "Not Found" },
              "500": { "description": "Internal Server Error" }
            }
          },
          "delete": {
            "tags": ["Audit Log"],
            "summary": "Delete an audit log by audit_id",
            "description": "Remove an audit log entry from the system",
            "parameters": [
              { "name": "audit_id", "in": "path", "required": true, "type": "string", "description": "ID of the audit log entry" }
            ],
            "responses": {
              "200": { "description": "OK" },
              "404": { "description": "Not Found" },
              "500": { "description": "Internal Server Error" }
            }
          }
        },
        // Order Items Endpoints
        "/api/order-items": {
          "post": {
            "tags": ["Order Items"],
            "summary": "Create an order item",
            "description": "Add a new item to an order",
            "parameters": [{
              "name": "body",
              "in": "body",
              "required": true,
              "schema": {
                "type": "object",
                "properties": {
                  "order_id": { "type": "string", "example": "12345" },
                  "menu_item_id": { "type": "string", "example": "67890" },
                  "quantity": { "type": "integer", "example": 2 },
                  "price": { "type": "number", "example": 19.99 }
                }
              }
            }],
            "responses": {
              "201": { "description": "Created" },
              "400": { "description": "Bad Request" },
              "500": { "description": "Internal Server Error" }
            }
          }
        },
        "/api/order-items/{order_id}": {
          "get": {
            "tags": ["Order Items"],
            "summary": "Fetch order items for a specific order by order_id",
            "description": "Retrieve all items in a specific order",
            "parameters": [
              { "name": "order_id", "in": "path", "required": true, "type": "string", "description": "ID of the order" }
            ],
            "responses": {
              "200": { "description": "OK" },
              "404": { "description": "Not Found" },
              "500": { "description": "Internal Server Error" }
            }
          }
        },
        "/api/order-items/{id}": {
          "put": {
            "tags": ["Order Items"],
            "summary": "Update an order item by id",
            "description": "Update details of a specific order item",
            "parameters": [
              { "name": "id", "in": "path", "required": true, "type": "string", "description": "ID of the order item" },
              { "name": "body", "in": "body", "required": true, "schema": { "type": "object", "properties": { "order_id": { "type": "string", "example": "12345" }, "menu_item_id": { "type": "string", "example": "67890" }, "quantity": { "type": "integer", "example": 3 }, "price": { "type": "number", "example": 19.99 } } } }
            ],
            "responses": {
              "200": { "description": "OK" },
              "400": { "description": "Bad Request" },
              "404": { "description": "Not Found" },
              "500": { "description": "Internal Server Error" }
            }
          },
          "delete": {
            "tags": ["Order Items"],
            "summary": "Delete an order item by id",
            "description": "Remove an item from an order",
            "parameters": [
              { "name": "id", "in": "path", "required": true, "type": "string", "description": "ID of the order item" }

            "responses": {

              "404": { "description": "Not Found" },
              "500": { "description": "Internal Server Error" }

        "/api/order-actions": {
          "post": {
            "tags": ["Order Actions"],
            "summary": "Create an order action",
            "description": "Add a new action to an order",
            "parameters": [{
              "name": "body",
              "in": "body",
              "required": true,
              "schema": {
                "type": "object",
                "properties": {
                  "order_id": { "type": "string", "example": "12345" },
                  "action_type": { "type": "string", "example": "status_change" },
                  "action_details": { "type": "string", "example": "Order status changed to preparing" },
                  "timestamp": { "type": "string", "example": "2023-06-15T14:30:00Z" }
                }
              }
            }],
            "responses": {
              "201": { "description": "Created" },
              "400": { "description": "Bad Request" },
              "500": { "description": "Internal Server Error" }
            }
          }
        },
        "/api/order-actions/{order_id}": {
          "get": {
            "tags": ["Order Actions"],
            "summary": "Fetch actions for a specific order by order_id",
            "description": "Retrieve all actions associated with a specific order",
            "parameters": [
              { "name": "order_id", "in": "path", "required": true, "type": "string", "description": "ID of the order" }
            ],
            "responses": {
              "200": { "description": "OK" },
              "404": { "description": "Not Found" },
              "500": { "description": "Internal Server Error" }
            }
          }
        },
        "/api/order-actions/{id}": {
          "put": {
            "tags": ["Order Actions"],
            "summary": "Update an order action by id",
            "description": "Update details of a specific order action",
            "parameters": [
              { "name": "id", "in": "path", "required": true, "type": "string", "description": "ID of the order action" },
              { "name": "body", "in": "body", "required": true, "schema": { "type": "object", "properties": { "order_id": { "type": "string", "example": "12345" }, "action_type": { "type": "string", "example": "status_change" }, "action_details": { "type": "string", "example": "Order status changed to preparing" }, "timestamp": { "type": "string", "example": "2023-06-15T14:30:00Z" } } } }
            ],
            "responses": {
              "200": { "description": "OK" },
              "400": { "description": "Bad Request" },
              "404": { "description": "Not Found" },
              "500": { "description": "Internal Server Error" }
            }
          },
          "delete": {
            "tags": ["Order Actions"],
            "summary": "Delete an order action by id",
            "description": "Remove an action from an order",
            "parameters": [
              { "name": "id", "in": "path", "required": true, "type": "string", "description": "ID of the order action" }
            ],
            "responses": {
              "200": { "description": "OK" },
              "404": { "description": "Not Found" },
              "500": { "description": "Internal Server Error" }
            }
          }
        },
        // Orders Endpoints
        "/api/orders": {
          "get": {
            "tags": ["Orders"],
            "summary": "Fetch all orders",
            "description": "Retrieve a list of all orders in the system",
            "responses": {
              "200": { "description": "OK" },
              "500": { "description": "Internal Server Error" }
            }
          },
          "post": {
            "tags": ["Orders"],
            "summary": "Create an order",
            "description": "Add a new order to the system",
            "parameters": [{
              "name": "body",
              "in": "body",

    // Initialize the documentation
    document.addEventListener('DOMContentLoaded', function() {
      generateSidebar();
      generateApiEndpoints();
      setupEventListeners();
    });

    // Generate sidebar menu
    function generateSidebar() {
      const sidebarMenu = document.getElementById('sidebar-menu');
      
      apiDocs.tags.forEach(tag => {
        const li = document.createElement('li');
        li.className = 'sidebar-item px-4 py-2 rounded cursor-pointer';
        li.textContent = tag.name;
        li.dataset.tag = tag.name;
        
        li.addEventListener('click', function() {
          // Remove active class from all items
          document.querySelectorAll('.sidebar-item').forEach(item => {
            item.classList.remove('active');
          });
          
          // Add active class to clicked item
          this.classList.add('active');
          
          // Scroll to the corresponding section
          const section = document.getElementById(`tag-${tag.name.replace(/\s+/g, '-').toLowerCase()}`);
          if (section) {
            section.scrollIntoView({ behavior: 'smooth' });
          }
        });
        
        sidebarMenu.appendChild(li);
      });
    }

    // Generate API endpoints
    function generateApiEndpoints() {
      const container = document.getElementById('api-endpoints-container');
      
      // Group endpoints by tags
      const groupedEndpoints = {};
      
      Object.keys(apiDocs.paths).forEach(path => {
        const pathData = apiDocs.paths[path];
        
        Object.keys(pathData).forEach(method => {
          const methodData = pathData[method];
          const tag = methodData.tags[0];
          
          if (!groupedEndpoints[tag]) {
            groupedEndpoints[tag] = [];
          }
          
          groupedEndpoints[tag].push({
            path,
            method,
            data: methodData
          });
        });
      });
      
      // Create sections for each tag
      Object.keys(groupedEndpoints).forEach(tag => {
        const section = document.createElement('div');
        section.id = `tag-${tag.replace(/\s+/g, '-').toLowerCase()}`;
        section.className = 'mb-12';
        
        const header = document.createElement('h2');
        header.className = 'text-2xl font-bold mb-6 text-gray-800 border-b pb-2';
        header.innerHTML = `<i class="fas fa-tag mr-2"></i>${tag}`;
        section.appendChild(header);
        
        // Add endpoints for this tag
        groupedEndpoints[tag].forEach(endpoint => {
          const endpointCard = createEndpointCard(endpoint);
          section.appendChild(endpointCard);
        });
        
        container.appendChild(section);
      });
    }

    // Create endpoint card
    function createEndpointCard(endpoint) {
      const card = document.createElement('div');
      card.className = `endpoint-card ${endpoint.method} bg-white rounded-lg shadow-md p-6 mb-6`;
      
      // Header with method and path
      const header = document.createElement('div');
      header.className = 'flex items-center justify-between mb-4';
      
      const methodPath = document.createElement('div');
      methodPath.className = 'flex items-center';
      
      const methodBadge = document.createElement('span');
      methodBadge.className = `method-${endpoint.method} text-white px-3 py-1 rounded-md text-sm font-medium mr-3`;
      methodBadge.textContent = endpoint.method.toUpperCase();
      
      const pathText = document.createElement('span');
      pathText.className = 'font-mono text-lg';
      pathText.textContent = endpoint.path;
      
      methodPath.appendChild(methodBadge);
      methodPath.appendChild(pathText);
      
      const toggleBtn = document.createElement('button');
      toggleBtn.className = 'text-gray-500 hover:text-gray-700';
      toggleBtn.innerHTML = '<i class="fas fa-chevron-down"></i>';
      
      header.appendChild(methodPath);
      header.appendChild(toggleBtn);
      
      // Summary
      const summary = document.createElement('h3');
      summary.className = 'text-lg font-semibold mb-2';
      summary.textContent = endpoint.data.summary;
      
      // Description
      const description = document.createElement('p');
      description.className = 'text-gray-600 mb-4';
      description.textContent = endpoint.data.description;
      
      // Content container (initially hidden)
      const content = document.createElement('div');
      content.className = 'endpoint-content hidden mt-4';
      
      // Parameters section
      if (endpoint.data.parameters && endpoint.data.parameters.length > 0) {
        const paramsSection = document.createElement('div');
        paramsSection.className = 'mb-6';
        
        const paramsTitle = document.createElement('h4');
        paramsTitle.className = 'text-md font-semibold mb-3';
        paramsTitle.innerHTML = '<i class="fas fa-list mr-2"></i>Parameters';
        
        const paramsTable = document.createElement('table');
        paramsTable.className = 'param-table w-full border-collapse';
        
        // Table header
        const thead = document.createElement('thead');
        const headerRow = document.createElement('tr');
        
        ['Name', 'Location', 'Type', 'Required', 'Description'].forEach(text => {
          const th = document.createElement('th');
          th.textContent = text;
          headerRow.appendChild(th);
        });
        
        thead.appendChild(headerRow);
        paramsTable.appendChild(thead);
        
        // Table body
        const tbody = document.createElement('tbody');
        
        endpoint.data.parameters.forEach(param => {
          const row = document.createElement('tr');
          
          // Name
          const nameCell = document.createElement('td');
          nameCell.textContent = param.name;
          row.appendChild(nameCell);
          
          // Location
          const locationCell = document.createElement('td');
          locationCell.innerHTML = `<span class="bg-gray-200 px-2 py-1 rounded text-xs">${param.in}</span>`;
          row.appendChild(locationCell);
          
          // Type
          const typeCell = document.createElement('td');
          if (param.schema) {
            typeCell.textContent = param.schema.type || 'object';
          } else {
            typeCell.textContent = param.type || 'string';
          }
          row.appendChild(typeCell);
          
          // Required
          const requiredCell = document.createElement('td');
          requiredCell.innerHTML = param.required ? 
            '<span class="text-red-500">Required</span>' : 
            '<span class="text-green-500">Optional</span>';
          row.appendChild(requiredCell);
          
          // Description
          const descCell = document.createElement('td');
          descCell.textContent = param.description || '';
          row.appendChild(descCell);
          
          tbody.appendChild(row);
        });
        
        paramsTable.appendChild(tbody);
        paramsSection.appendChild(paramsTitle);
        paramsSection.appendChild(paramsTable);
        content.appendChild(paramsSection);
      }
      
      // Request body section (for POST/PUT)
      if ((endpoint.method === 'post' || endpoint.method === 'put') && 
          endpoint.data.parameters && 
          endpoint.data.parameters.some(p => p.in === 'body')) {
        const bodySection = document.createElement('div');
        bodySection.className = 'mb-6';
        
        const bodyTitle = document.createElement('h4');
        bodyTitle.className = 'text-md font-semibold mb-3';
        bodyTitle.innerHTML = '<i class="fas fa-code mr-2"></i>Request Body';
        
        const bodyExample = document.createElement('div');
        bodyExample.className = 'code-block';
        
        const bodyParam = endpoint.data.parameters.find(p => p.in === 'body');
        const example = JSON.stringify(bodyParam.schema.example || {}, null, 2);
        
        bodyExample.innerHTML = `<pre>${example}</pre>`;
        
        bodySection.appendChild(bodyTitle);
        bodySection.appendChild(bodyExample);
        content.appendChild(bodySection);
      }
      
      // Response section
      const responseSection = document.createElement('div');
      responseSection.className = 'mb-6';
      
      const responseTitle = document.createElement('h4');
      responseTitle.className = 'text-md font-semibold mb-3';
      responseTitle.innerHTML = '<i class="fas fa-reply mr-2"></i>Responses';
      
      const responseTable = document.createElement('table');
      responseTable.className = 'param-table w-full border-collapse';
      
      // Table header
      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');
      
      ['Status Code', 'Description'].forEach(text => {
        const th = document.createElement('th');
        th.textContent = text;
        headerRow.appendChild(th);
      });
      
      thead.appendChild(headerRow);
      responseTable.appendChild(thead);
      
      // Table body
      const tbody = document.createElement('tbody');
      
      Object.keys(endpoint.data.responses).forEach(statusCode => {
        const row = document.createElement('tr');
        
        // Status Code
        const statusCell = document.createElement('td');
        statusCell.innerHTML = `<span class="status-code-${statusCode} font-medium">${statusCode}</span>`;
        row.appendChild(statusCell);
        
        // Description
        const descCell = document.createElement('td');
        descCell.textContent = endpoint.data.responses[statusCode].description;
        row.appendChild(descCell);
        
        tbody.appendChild(row);
      });
      
      responseTable.appendChild(tbody);
      responseSection.appendChild(responseTitle);
      responseSection.appendChild(responseTable);
      content.appendChild(responseSection);
      
      // Try it out section
      const trySection = document.createElement('div');
      trySection.className = 'mb-6';
      
      const tryTitle = document.createElement('h4');
      tryTitle.className = 'text-md font-semibold mb-3';
      tryTitle.innerHTML = '<i class="fas fa-play-circle mr-2"></i>Try it out';
      
      // Form for parameters
      const form = document.createElement('div');
      form.className = 'bg-gray-50 p-4 rounded-md';
      
      // Add input fields for path parameters
      if (endpoint.data.parameters) {
        endpoint.data.parameters.forEach(param => {
          if (param.in === 'path') {
            const inputGroup = document.createElement('div');
            inputGroup.className = 'mb-3';
            
            const label = document.createElement('label');
            label.className = 'block text-sm font-medium text-gray-700 mb-1';
            label.textContent = `${param.name} ${param.required ? '*' : ''}`;
            
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500';
            input.placeholder = `Enter ${param.name}`;
            input.dataset.param = param.name;
            input.dataset.paramType = param.in;
            
            inputGroup.appendChild(label);
            inputGroup.appendChild(input);
            form.appendChild(inputGroup);
          }
        });
      }
      
      // Add textarea for body parameters (POST/PUT)
      if ((endpoint.method === 'post' || endpoint.method === 'put') && 
          endpoint.data.parameters && 
          endpoint.data.parameters.some(p => p.in === 'body')) {
        const bodyParam = endpoint.data.parameters.find(p => p.in === 'body');
        
        const inputGroup = document.createElement('div');
        inputGroup.className = 'mb-3';
        
        const label = document.createElement('label');
        label.className = 'block text-sm font-medium text-gray-700 mb-1';
        label.textContent = 'Request Body *';
        
        const textarea = document.createElement('textarea');
        textarea.className = 'w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm';
        textarea.rows = 8;
        textarea.placeholder = 'Enter request body in JSON format';
        textarea.dataset.paramType = 'body';
        
        // Set default example
        const example = JSON.stringify(bodyParam.schema.example || {}, null, 2);
        textarea.value = example;
        
        inputGroup.appendChild(label);
        inputGroup.appendChild(textarea);
        form.appendChild(inputGroup);
      }
      
      // Execute button
      const executeBtn = document.createElement('button');
      executeBtn.className = 'bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition flex items-center';
      executeBtn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i>Execute';
      
      // Loading spinner
      const spinner = document.createElement('div');
      spinner.className = 'loading-spinner ml-2';
      
      executeBtn.appendChild(spinner);
      
      executeBtn.addEventListener('click', function() {
        executeApiCall(endpoint, form, spinner);
      });
      
      form.appendChild(executeBtn);
      trySection.appendChild(tryTitle);
      trySection.appendChild(form);
      content.appendChild(trySection);
      
      // Toggle content visibility
      toggleBtn.addEventListener('click', function() {
        content.classList.toggle('hidden');
        const icon = this.querySelector('i');
        icon.classList.toggle('fa-chevron-down');
        icon.classList.toggle('fa-chevron-up');
      });
      
      // Assemble the card
      card.appendChild(header);
      card.appendChild(summary);
      card.appendChild(description);
      card.appendChild(content);
      
      return card;
    }

    // Execute API call
    function executeApiCall(endpoint, form, spinner) {
      // Show loading spinner
      spinner.style.display = 'inline-block';
      
      // Build URL with path parameters
      let url = `https://mk-be.vercel.app${endpoint.path}`;
      
      // Replace path parameters
      endpoint.data.parameters.forEach(param => {
        if (param.in === 'path') {
          const input = form.querySelector(`[data-param="${param.name}"]`);
          if (input && input.value) {
            url = url.replace(`{${param.name}}`, input.value);
          }
        }
      });
      
      // Prepare request options
      const options = {
        method: endpoint.method.toUpperCase(),
        headers: {
          'Content-Type': 'application/json',
        }
      };
      
      // Add body for POST/PUT requests
      if ((endpoint.method === 'post' || endpoint.method === 'put')) {
        const bodyTextarea = form.querySelector('[data-param-type="body"]');
        if (bodyTextarea) {
          try {
            options.body = bodyTextarea.value;
          } catch (e) {
            showNotification('Invalid JSON in request body', 'error');
            spinner.style.display = 'none';
            return;
          }
        }
      }
      
      // Record start time
      const startTime = new Date().getTime();
      
      // Make the API call
      fetch(url, options)
        .then(response => {
          // Record end time
          const endTime = new Date().getTime();
          const responseTime = endTime - startTime;
          
          // Get response status
          const status = response.status;
          const statusText = response.statusText;
          
          // Return response data and metadata
          return response.json().then(data => ({
            data,
            status,
            statusText,
            responseTime
          })).catch(() => ({
            data: null,
            status,
            statusText,
            responseTime
          }));
        })
        .then(result => {
          // Hide loading spinner
          spinner.style.display = 'none';
          
          // Show response in modal
          showResponseModal(result);
          
          // Show notification
          if (result.status >= 200 && result.status < 300) {
            showNotification(`API call successful (${result.status})`, 'success');
          } else {
            showNotification(`API call failed (${result.status})`, 'error');
          }
        })
        .catch(error => {
          // Hide loading spinner
          spinner.style.display = 'none';
          
          // Show error response
          showResponseModal({
            data: { error: error.message },
            status: 0,
            statusText: 'Network Error',
            responseTime: 0
          });
          
          // Show error notification
          showNotification('Network error occurred', 'error');
        });
    }

    // Show response modal
    function showResponseModal(result) {
      const modal = document.getElementById('response-modal');
      const statusElement = document.getElementById('response-status');
      const timeElement = document.getElementById('response-time');
      const responseText = document.getElementById('response-text');
      
      // Set status
      statusElement.textContent = `${result.status} ${result.statusText}`;
      statusElement.className = 'px-3 py-1 rounded-full text-sm font-medium';
      
      if (result.status >= 200 && result.status < 300) {
        statusElement.classList.add('bg-green-100', 'text-green-800');
      } else if (result.status >= 400 && result.status < 500) {
        statusElement.classList.add('bg-yellow-100', 'text-yellow-800');
      } else {
        statusElement.classList.add('bg-red-100', 'text-red-800');
      }
      
      // Set response time
      timeElement.textContent = `Response time: ${result.responseTime}ms`;
      
      // Set response text
      if (result.data) {
        responseText.textContent = JSON.stringify(result.data, null, 2);
      } else {
        responseText.textContent = 'No response body';
      }
      
      // Show modal
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    // Show notification
    function showNotification(message, type) {
      const notification = document.getElementById('notification');
      
      notification.textContent = message;
      notification.className = 'notification';
      notification.classList.add(type);
      notification.classList.add('show');
      
      // Hide notification after 3 seconds
      setTimeout(() => {
        notification.classList.remove('show');
      }, 3000);
    }

    // Setup event listeners
    function setupEventListeners() {
      // Close response modal
      document.getElementById('close-modal').addEventListener('click', function() {
        const modal = document.getElementById('response-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      });
      
      // Copy response
      document.getElementById('copy-response').addEventListener('click', function() {
        const responseText = document.getElementById('response-text').textContent;
        navigator.clipboard.writeText(responseText).then(() => {
          showNotification('Response copied to clipboard', 'success');
        }).catch(() => {
          showNotification('Failed to copy response', 'error');
        });
      });
      
      // Show Swagger JSON
      document.getElementById('swagger-btn').addEventListener('click', function() {
        const modal = document.getElementById('swagger-modal');
        const swaggerJson = document.getElementById('swagger-json');
        
        swaggerJson.textContent = JSON.stringify(apiDocs, null, 2);
        
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      });
      
      // Close Swagger modal
      document.getElementById('close-swagger-modal').addEventListener('click', function() {
        const modal = document.getElementById('swagger-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      });
      
      // Copy Swagger JSON
      document.getElementById('copy-swagger').addEventListener('click', function() {
        const swaggerJson = JSON.stringify(apiDocs, null, 2);
        navigator.clipboard.writeText(swaggerJson).then(() => {
          showNotification('Swagger JSON copied to clipboard', 'success');
        }).catch(() => {
          showNotification('Failed to copy Swagger JSON', 'error');
        });
      });
      
      // Close modals when clicking outside
      window.addEventListener('click', function(event) {
        const responseModal = document.getElementById('response-modal');
        const swaggerModal = document.getElementById('swagger-modal');
        
        if (event.target === responseModal) {
          responseModal.classList.add('hidden');
          responseModal.classList.remove('flex');
        }
        
        if (event.target === swaggerModal) {
          swaggerModal.classList.add('hidden');
          swaggerModal.classList.remove('flex');
        }
      });
    }
  </script>
</body>
</html>
