<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mamma's Kitchen API Documentation</title>

  <!-- Link to Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Link to Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
    .api-section {
      background-color: #f9fafb;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .api-method {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .api-method button {
      background-color: #1D4ED8;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .api-method button:hover {
      background-color: #2563EB;
    }
    .api-description {
      font-size: 0.9rem;
      color: #4B5563;
    }
    .response-container {
      background-color: #f3f4f6;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #333;
      white-space: pre-wrap;
      word-wrap: break-word;
      max-height: 400px;
      overflow-y: auto;
    }
    .response-container pre {
      margin: 0;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
    }
    .api-title {
      font-size: 1.25rem;
      font-weight: bold;
      color: #1D4ED8;
    }
    .api-toggle-btn {
      cursor: pointer;
      font-size: 1rem;
      color: #1D4ED8;
      border: none;
      background: none;
    }
    .api-toggle-btn:hover {
      text-decoration: underline;
    }
    .api-section-collapsed {
      display: none;
    }
  </style>
</head>
<body class="bg-gray-100">

  <!-- Navbar Section -->
  <header class="bg-blue-500 text-white p-4">
    <div class="container mx-auto">
      <h1 class="text-3xl font-semibold">Mamma's Kitchen API Documentation</h1>
      <p class="text-sm mt-1">Explore and test all the available API endpoints</p>
    </div>
  </header>

  <!-- Main Content Section -->
  <div class="container mx-auto mt-10" id="api-docs-container"></div>

  <!-- API Response Display -->
  <div class="container mx-auto mt-10">
    <div class="response-container" id="response-container">
      <p class="font-semibold">API Response:</p>
      <pre id="response-text"></pre>
    </div>
  </div>

  <!-- JavaScript to handle API testing -->
  <script>
    const apiDocs = {
      "swagger": "2.0",
      "info": {
        "title": "Mamma's Kitchen API",
        "description": "API documentation for Mamma's Kitchen",
        "version": "1.0.0"
      },
      "host": "mk-be.vercel.app",
      "basePath": "/",
      "schemes": ["https"],
      "paths": {
        "/api/users/": {
          "get": {
            "description": "Fetch all users",
            "responses": {
              "200": { "description": "OK" },
              "500": { "description": "Internal Server Error" }
            }
          },
          "post": {
            "description": "Create a new user",
            "parameters": [{
              "name": "body",
              "in": "body",
              "schema": {
                "type": "object",
                "properties": {
                  "username": { "example": "any" },
                  "email": { "example": "any" },
                  "password": { "example": "any" },
                  "role": { "example": "any" }
                }
              }
            }],
            "responses": {
              "201": { "description": "Created" },
              "500": { "description": "Internal Server Error" }
            }
          }
        },
        "/api/users/{user_id}": {
          "get": {
            "description": "Fetch a specific user by user_id",
            "parameters": [
              { "name": "user_id", "in": "path", "required": true, "type": "string" }
            ],
            "responses": {
              "200": { "description": "OK" },
              "404": { "description": "Not Found" },
              "500": { "description": "Internal Server Error" }
            }
          },
          "put": {
            "description": "Update a user by user_id",
            "parameters": [
              { "name": "user_id", "in": "path", "required": true, "type": "string" },
              { "name": "body", "in": "body", "schema": { "type": "object", "properties": { "username": { "example": "any" }, "email": { "example": "any" }, "password": { "example": "any" }, "role": { "example": "any" } } } }
            ],
            "responses": {
              "200": { "description": "OK" },
              "404": { "description": "Not Found" },
              "500": { "description": "Internal Server Error" }
            }
          },
          "delete": {
            "description": "Delete a user by user_id",
            "parameters": [
              { "name": "user_id", "in": "path", "required": true, "type": "string" }
            ],
            "responses": {
              "200": { "description": "OK" },
              "404": { "description": "Not Found" },
              "500": { "description": "Internal Server Error" }
            }
          }
        },
        "/api/login/": {
          "post": {
            "description": "Record a login attempt",
            "parameters": [{
              "name": "body",
              "in": "body",
              "schema": {
                "type": "object",
                "properties": {
                  "user_id": { "example": "any" },
                  "ip_address": { "example": "any" },
                  "user_agent": { "example": "any" },
                  "login_status": { "example": "any" }
                }
              }
            }],
            "responses": {
              "201": { "description": "Created" },
              "500": { "description": "Internal Server Error" }
            }
          }
        }
      }
    };

    function generateApiDocs() {
      const container = document.getElementById('api-docs-container');
      Object.keys(apiDocs.paths).forEach(path => {
        const pathData = apiDocs.paths[path];
        const section = document.createElement('div');
        section.classList.add('api-section');

        const header = document.createElement('h2');
        header.classList.add('text-2xl', 'font-bold', 'mb-4');
        header.innerText = path;
        section.appendChild(header);

        Object.keys(pathData).forEach(method => {
          const methodData = pathData[method];
          const methodDiv = document.createElement('div');
          methodDiv.classList.add('api-method');

          const methodTitle = document.createElement('span');
          methodTitle.classList.add('font-semibold');
          methodTitle.innerText = `${method.toUpperCase()} ${path}`;
          methodDiv.appendChild(methodTitle);

          const button = document.createElement('button');
          button.classList.add('api-button');
          button.innerText = `Test ${method.toUpperCase()}`;
          button.onclick = () => testApi(method, `https://mk-be.vercel.app${path}`);
          methodDiv.appendChild(button);

          section.appendChild(methodDiv);

          const description = document.createElement('p');
          description.classList.add('api-description');
          description.innerText = methodData.description || 'No description available';
          section.appendChild(description);
        });

        container.appendChild(section);
      });
    }

    function testApi(method, url) {
      fetch(url, {
        method: method.toUpperCase(),
        headers: {
          'Content-Type': 'application/json',
        },
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById('response-text').innerText = JSON.stringify(data, null, 2);
      })
      .catch(error => {
        document.getElementById('response-text').innerText = 'Error: ' + error;
      });
    }

    // Initialize the docs
    generateApiDocs();
  </script>

</body>
</html>
